[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/zyvorai/vayora"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Paise amounts use Indian-style groups (`50_000_00` = ₹50,000.00).
[workspace.lints.clippy]
inconsistent_digit_grouping = "allow"
