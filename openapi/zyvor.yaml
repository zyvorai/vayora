  /v1/mandates:
    post:
      summary: Create a UPI AutoPay mandate for the payer to approve
      description: 'Body: customer_id, max_amount_minor (per debit), frequency (daily, weekly, fortnightly, monthly, bimonthly, quarterly, half_yearly, yearly or as_presented), start_date, end_date, optional provider and external_ref. Needs a connected provider that supports mandates (today only the simulator); otherwise 422 no_route. Requires an Idempotency-Key. The response carries the authorization link the payer approves. The limit and notice rules are configurable (ZYVOR_MANDATE_MAX_MINOR, ZYVOR_MANDATE_NOTICE_HOURS) and must be checked against the current NPCI circular and your provider before live use.'
      tags:
      - mandates
      parameters:
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses:
        '201':
          description: The mandate, pending the payer's approval
        '422':
          description: Invalid limit, dates, currency or no provider supports mandates
    get:
      summary: List mandates
      description: 'Filter by status or customer_id.'
      tags:
      - mandates
      responses:
        '200':
          description: OK
  /v1/mandates/run:
    post:
      summary: Run the mandate pass for this tenant now
      description: 'Expires ended mandates, emits due pre-debit notices, sends the debits that are due and settles those in flight. The worker does this on its own; this is a sandbox and test aid. The in-process simulator only works when the API itself runs the pass.'
      tags:
      - mandates
      responses:
        '200':
          description: OK
