        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list billing milestones
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/milestones/{id}/complete:
