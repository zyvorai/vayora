      summary: Set a console user's password
      tags:
      - console_users
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/console/users/{id}/mfa/begin:
    post:
      summary: Start TOTP enrolment
      tags:
      - console_users
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/console/users/{id}/mfa/confirm:
    post:
      summary: Confirm TOTP enrolment and receive recovery codes
      tags:
      - console_users
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/console/users/{id}/mfa/reset:
    post:
      summary: Remove a user's second factor
      tags:
