  /v1/sim/circle/pay:
    post:
      summary: A delegate pays a sandbox UPI payload through a simulated circle (test mode only)
      description: 'Body: circle_id and upi_uri. The amount is read from the payment, never from the request, and the per-payment
        and total limits are checked before anything is approved. Answers 404 unless ZYVOR_SIM_PAYER=1.'
      tags:
      - sandbox
      responses:
