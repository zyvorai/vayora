      tags:
      - console_users
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/console/users/{id}/disable:
    post:
      summary: Disable a console user
      tags:
      - console_users
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/console/users/{id}/enable:
