      description: 'Body: mandate_id. Answers 404 unless ZYVOR_SIM_PAYER=1. Zyvor learns of it when the mandate is refreshed.'
      tags:
      - mandates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {}
        '404':
