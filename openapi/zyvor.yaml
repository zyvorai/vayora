      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/console/authenticate:
    post:
      summary: Check a person's username, password and code for the console
      tags:
      - console_users
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/signup:
    post:
      summary: Public: create an organisation with test and live tenants, a first admin user and a test key (shown once)
      tags:
      - signup
      security: []
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/signup/verify:
