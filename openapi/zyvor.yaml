openapi: 3.1.0
info:
  title: Zyvor Payments API
  version: 0.1.0
  description: Multi-tenant payment orchestration, ledger and reconciliation. Amounts are integer minor units (paise). Provider
    integrations are SANDBOX/SIMULATED until verified against live provider sandboxes. Every state-changing payment endpoint
    requires an Idempotency-Key.
servers:
- url: http://localhost:8080
  description: local
security:
- bearer: []
paths:
  /v1/payment_intents/{id}:
    get:
      summary: Get a payment intent with its attempts
      tags:
      - payments
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}:
    get:
      summary: Get an attempt
      tags:
      - payments
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}/simulate_event:
    post:
      summary: Deliver the provider's late update for a pending simulated payment (test mode only)
      tags:
      - payments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/refunds:
    get:
      summary: List refunds (filter status=failed for the failed-refund queue)
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/refunds/{id}:
    get:
      summary: Get a refund
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/approve:
    post:
      summary: Approve a refund above the threshold (different person than requester)
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/reject:
    post:
      summary: Reject a refund awaiting approval
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/retry:
    post:
      summary: Retry a failed refund
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/refresh:
    post:
      summary: Resolve a refund with an unknown outcome
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/settlements:
    get:
      summary: List settlements
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/settlements/import:
    post:
      summary: Import a provider settlement
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/settlements/sync:
    post:
      summary: Pull settlements from the provider
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/settlements/{id}/simulate_bank:
    post:
      summary: Add the bank credit a simulated settlement would produce (test mode only)
      tags:
      - reconciliation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/settlements/{id}/explain:
    get:
      summary: Explain every rupee of a settlement
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/bank_statements/import:
    post:
      summary: Import bank statement lines and match them
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/recon/cases:
    get:
      summary: List reconciliation cases
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/recon/cases/{id}/assign:
    post:
      summary: Assign a case
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/recon/cases/{id}/resolve:
    post:
      summary: Resolve a case
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/recon/scan:
    post:
      summary: Find captured payments missing from settlements
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/analytics/cost:
    get:
      summary: Effective processing cost and routing suggestions
      tags:
      - analytics
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/api_keys:
    get:
      summary: Create or list scoped API keys
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list scoped API keys
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/api_keys/{id}/rotate:
    post:
      summary: Mint a replacement key; the old one expires after an overlap window
      tags:
      - keys
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/api_keys/{id}/revoke:
    post:
      summary: Revoke an API key
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/customers:
    get:
      summary: Find customers (external_ref filter)
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create a customer
      tags:
      - customers
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/customers/{id}:
    get:
      summary: Get a customer
      tags:
      - customers
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Correct a customer's details (left-out fields stay; an empty string clears)
      tags:
      - customers
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/branches:
    get:
      summary: Create or list branches
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list branches
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/users:
    post:
      summary: Create a user
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/invoices:
    get:
      summary: Create or list invoices
      tags:
      - invoices
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list invoices
      tags:
      - invoices
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/invoices/{id}:
    get:
      summary: Get an invoice with allocations
      tags:
      - invoices
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/collections/ageing:
    get:
      summary: Outstanding invoices by days past due (as_of optional)
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/collections/promises:
    get:
      summary: Promises to pay with derived status (open, kept, broken, canceled)
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/collections/dunning/run:
    post:
      summary: Remind every overdue invoice with no live promise (repeat-safe)
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/collections/drafts:
    get:
      summary: Reminder drafts waiting for a decision
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/collections/drafts/{id}/approve:
    post:
      summary: Approve a reminder draft (optionally edited): logs it and emits invoice.reminder
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/collections/drafts/{id}/reject:
    post:
      summary: Reject a reminder draft
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/invoices/{id}/reminders/draft:
    post:
      summary: Draft a reminder for review, optionally worded by the AI assistant
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/collections/promises/{id}/cancel:
    post:
      summary: Cancel a promise to pay
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/invoices/{id}/promises:
    post:
      summary: Record a promise to pay against an invoice
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/invoices/{id}/reminders:
    get:
      summary: Reminder history for an invoice
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Log a reminder and emit invoice.reminder
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/plans:
    get:
      summary: Create or list billing plans
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list billing plans
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/subscriptions:
    get:
      summary: Create or list subscriptions
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list subscriptions
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/subscriptions/{id}/pause:
    post:
      summary: Pause a subscription
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/subscriptions/{id}/resume:
    post:
      summary: Resume a paused subscription
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/subscriptions/{id}/cancel:
    post:
      summary: Cancel a subscription
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/subscriptions/{id}/usage:
    post:
      summary: Record metered usage (idempotent by reference)
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/billing/run:
    post:
      summary: Invoice every subscription that is due (idempotent per period)
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/invoices/{id}/credit_notes:
    post:
      summary: Issue a credit note against an invoice
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/invoices/{id}/void:
    post:
      summary: Void an unpaid, uncredited invoice
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/customers/{id}/statement:
    get:
      summary: Customer statement with running balance
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/subscriptions/{id}/change_plan:
    post:
      summary: Change plan mid-period; upgrades are prorated
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/milestones:
    get:
      summary: Create or list billing milestones
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list billing milestones
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/milestones/{id}/complete:
    post:
      summary: Accept a milestone and invoice it (idempotent)
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/milestones/{id}/cancel:
    post:
      summary: Cancel a pending milestone
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/bank_statements/import_csv:
    post:
      summary: Import a bank statement CSV ({csv}); unreadable files are rejected, re-imports add nothing
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/disputes:
    get:
      summary: Open or list disputes (an open dispute holds the amount so it cannot be refunded)
      tags:
      - disputes
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Open or list disputes (an open dispute holds the amount so it cannot be refunded)
      tags:
      - disputes
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/disputes/{id}/evidence:
    post:
      summary: Attach evidence (a note and a link to the document)
      tags:
      - disputes
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/disputes/{id}/resolve:
    post:
      summary: Record the outcome: won releases the hold, lost books the loss and re-opens the invoice
      tags:
      - disputes
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/settings:
    get:
      summary: Get or update settings (approval threshold, routing, outbound webhook)
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Get or update settings (approval threshold, routing, outbound webhook)
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/audit_events/seal:
    post:
      summary: Seal unsealed audit events into the tamper-evident chain
      tags:
      - audit
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/audit_events/verify:
    get:
      summary: Recompute the audit chain and report where it breaks
      tags:
      - audit
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/console/branches:
    get:
      summary: Branches a person can be tied to (this organisation's home environment)
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/console/users:
    post:
      summary: Create a console user
      tags:
      - console_users
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    get:
      summary: List console users
      tags:
      - console_users
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/console/users/{id}/disable:
    post:
      summary: Disable a console user
      tags:
      - console_users
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
