    post:
      summary: The primary takes a simulated circle back (test mode only)
      description: 'Body: circle_id. Answers 404 unless ZYVOR_SIM_PAYER=1. Spends already made stay recorded.'
      tags:
      - sandbox
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {}
        '404':
          description: Not enabled on this server
        '409':
