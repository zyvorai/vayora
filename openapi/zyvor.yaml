      description: 'Body: {"upi_uri": "upi://pay?pa=sandbox@zyvor-sim&tn=<attempt_id>...", "approve": true}. Lets a test payer app complete a payment against the in-process simulator without a bank. Answers 404 unless the server was started with ZYVOR_SIM_PAYER=1. 422 not_a_sim_payment when the payee is not the simulator or the input is not a UPI link; 409 nothing_to_pay when the attempt is not waiting for a payer. Never touches a real provider.'
