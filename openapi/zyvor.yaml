  /v1/payment_links/{id}/cancel:
    post:
      summary: Cancel a payment link
      tags:
      - payment_links
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/checkout/links/{tenant_id}/{token}:
    get:
      summary: Public payment link details
      tags:
      - checkout
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
      - name: token
        in: path
        required: true
        schema:
          type: string
  /v1/checkout/links/{tenant_id}/{token}/start:
    post:
      summary: Open a payment link: mints a payment intent for this payer
