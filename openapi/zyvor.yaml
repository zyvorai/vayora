openapi: 3.1.0
info:
  title: Zyvor Payments API
  version: 0.1.0
  description: Multi-tenant payment orchestration, ledger and reconciliation. Amounts are integer minor units (paise). Provider
    integrations are SANDBOX/SIMULATED until verified against live provider sandboxes. Every state-changing payment endpoint
    requires an Idempotency-Key.
servers:
- url: http://localhost:8080
  description: local
security:
- bearer: []
paths:
  /v1/payment_intents/{id}:
    get:
      summary: Get a payment intent with its attempts
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  intent: {}
                  attempts: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}:
    get:
      summary: Get an attempt
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}/refresh:
    post:
      summary: Ask the provider where an attempt stands now
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}/cancel:
    post:
      summary: Cancel an attempt that has not been paid
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}/capture:
    post:
      summary: Capture an authorised attempt (manual capture)
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/provider_accounts/{provider}/enabled:
    post:
      summary: Turn a provider on or off for routing (send enabled true or false)
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: {}
                  enabled: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Toggle'
  /v1/payment_attempts/{id}/simulate_event:
    post:
      summary: Deliver the provider's late update for a pending simulated payment (test mode only)
      tags:
      - payments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateEvent'
  /v1/refunds:
    get:
      summary: List refunds (filter status=failed for the failed-refund queue)
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
                  has_more: {}
        4XX:
          $ref: '#/components/responses/Error'
  /v1/refunds/{id}:
    get:
      summary: Get a refund
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/approve:
    post:
      summary: Approve a refund above the threshold (different person than requester)
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/reject:
    post:
      summary: Reject a refund awaiting approval
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/retry:
    post:
      summary: Retry a failed refund
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/refresh:
    post:
      summary: Resolve a refund with an unknown outcome
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/settlements:
    get:
      summary: List settlements
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        4XX:
          $ref: '#/components/responses/Error'
  /v1/settlements/import:
    post:
      summary: Import a provider settlement
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSettlement'
  /v1/settlements/sync:
    post:
      summary: Pull settlements from the provider
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
  /v1/settlements/{id}/simulate_bank:
    post:
      summary: Add the bank credit a simulated settlement would produce (test mode only)
      tags:
      - reconciliation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateBank'
  /v1/settlements/{id}/explain:
    get:
      summary: Explain every rupee of a settlement
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/bank_statements/import:
    post:
      summary: Import bank statement lines and match them
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: {}
                  settlements_rechecked: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBank'
  /v1/recon/cases:
    get:
      summary: List reconciliation cases
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
        x-generated: true
      - name: kind
        in: query
        required: false
        schema:
          type: string
        x-generated: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
        x-generated: true
  /v1/recon/cases/{id}/assign:
    post:
      summary: Assign a case
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  status: {}
                  assignee: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assign'
  /v1/recon/cases/{id}/resolve:
    post:
      summary: Resolve a case
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  status: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconResolve'
  /v1/recon/scan:
    post:
      summary: Find captured payments missing from settlements
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_cases: {}
        4XX:
          $ref: '#/components/responses/Error'
  /v1/analytics/cost:
    get:
      summary: Effective processing cost and routing suggestions
      tags:
      - analytics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  by_provider_method: {}
                  suggestions: {}
        4XX:
          $ref: '#/components/responses/Error'
  /v1/api_keys:
    get:
      summary: Create or list scoped API keys
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        branch_id: {}
                        id: {}
                        name: {}
                        prefix: {}
                        scopes: {}
                        created_at: {}
                        revoked_at: {}
                        expires_at: {}
                        last_used_at: {}
                        allowed_cidrs: {}
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list scoped API keys
      tags:
      - admin
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  key: {}
                  prefix: {}
                  scopes: {}
                  expires_at: {}
                  allowed_cidrs: {}
                  note: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewKey'
  /v1/api_keys/{id}/rotate:
    post:
      summary: Mint a replacement key; the old one expires after an overlap window
      tags:
      - keys
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  key: {}
                  prefix: {}
                  scopes: {}
                  rotated_from: {}
                  old_key_expires_in_hours: {}
                  note: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateBody'
  /v1/api_keys/{id}/revoke:
    post:
      summary: Revoke an API key
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  revoked: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/customers:
    get:
      summary: Find customers (external_ref filter)
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {}
                        name: {}
                        email: {}
                        phone: {}
                        external_ref: {}
                        gstin: {}
                        address1: {}
                        location: {}
                        pincode: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: external_ref
        in: query
        required: false
        schema:
          type: string
        x-generated: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
        x-generated: true
    post:
      summary: Create a customer
      tags:
      - customers
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  name: {}
                  email: {}
                  phone: {}
                  external_ref: {}
                  gstin: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCustomer'
  /v1/customers/{id}:
    get:
      summary: Get a customer
      tags:
      - customers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  name: {}
                  email: {}
                  phone: {}
                  external_ref: {}
                  gstin: {}
                  address1: {}
                  location: {}
                  pincode: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Correct a customer's details (left-out fields stay; an empty string clears)
      tags:
      - customers
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
  /v1/branches:
    get:
      summary: Create or list branches
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {}
                        name: {}
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list branches
      tags:
      - admin
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  name: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBranch'
  /v1/users:
    post:
      summary: Create a user
      tags:
      - admin
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  email: {}
                  role: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNewUser'
  /v1/invoices:
    get:
      summary: Create or list invoices
      tags:
      - invoices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {}
                        number: {}
                        amount_minor:
                          type: integer
                        paid_minor:
                          type: integer
                        outstanding_minor:
                          type: integer
                        status: {}
                        due_date: {}
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list invoices
      tags:
      - invoices
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  number: {}
                  amount_minor:
                    type: integer
                  tax_minor:
                    type: integer
                  status: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInvoice'
  /v1/invoices/{id}:
    get:
      summary: Get an invoice with allocations
      tags:
      - invoices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  number: {}
                  currency: {}
                  amount_minor:
                    type: integer
                  tax_minor:
                    type: integer
                  external_ref: {}
                  status: {}
                  due_date: {}
                  customer_id: {}
                  place_of_supply: {}
                  buyer_gstin: {}
                  reverse_charge: {}
                  issued_on: {}
                  paid_minor:
                    type: integer
                  credited_minor:
                    type: integer
                  outstanding_minor:
                    type: integer
                  allocations:
                    type: array
                    items:
                      type: object
                      properties:
                        intent_id: {}
                        amount_minor:
                          type: integer
                        reference: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/collections/ageing:
    get:
      summary: Outstanding invoices by days past due (as_of optional)
      tags:
      - collections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of: {}
                  data: {}
                  total_outstanding_inr_minor:
                    type: integer
                  usd_rate_date: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date
        x-generated: true
  /v1/collections/promises:
    get:
      summary: Promises to pay with derived status (open, kept, broken, canceled)
      tags:
      - collections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        4XX:
          $ref: '#/components/responses/Error'
  /v1/collections/dunning/run:
    post:
      summary: Remind every overdue invoice with no live promise (repeat-safe); test mode may pass as_of to run as of another
        day
      tags:
      - collections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminded: {}
                  drafts_created: {}
                  draft_ids: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DunningBody'
  /v1/collections/drafts:
    get:
      summary: Reminder drafts waiting for a decision
      tags:
      - collections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
        x-generated: true
  /v1/collections/drafts/{id}/approve:
    post:
      summary: 'Approve a reminder draft (optionally edited): logs it and emits invoice.reminder'
      tags:
      - collections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  status: {}
                  reminder_id: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Approve'
  /v1/collections/drafts/{id}/reject:
    post:
      summary: Reject a reminder draft
      tags:
      - collections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  status: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/invoices/{id}/reminders/draft:
    post:
      summary: Draft a reminder for review, optionally worded by the AI assistant
      tags:
      - collections
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  invoice_id: {}
                  channel: {}
                  message: {}
                  source: {}
                  status: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftReq'
  /v1/collections/promises/{id}/cancel:
    post:
      summary: Cancel a promise to pay
      tags:
      - collections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  status: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/invoices/{id}/promises:
    post:
