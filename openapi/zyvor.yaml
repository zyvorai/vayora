        4XX:
          $ref: '#/components/responses/Error'
  /v1/disputes:
    get:
      summary: Open or list disputes (an open dispute holds the amount so it cannot be refunded)
      tags:
      - disputes
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Open or list disputes (an open dispute holds the amount so it cannot be refunded)
      tags:
      - disputes
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/disputes/{id}/evidence:
