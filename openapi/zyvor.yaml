          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateRow'
        '409':
          description: The mandate is not in a state that allows this
        '404':
          description: Not found
  /v1/mandates/{id}/revoke:
    post:
      summary: Revoke a mandate
      description: Stops debiting first, cancels debits not yet sent, then asks the provider; a provider failure is recorded
        on the mandate, not hidden.
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateRow'
        '409':
          description: The mandate is not in a state that allows this
        '404':
          description: Not found
  /v1/mandates/{id}/debits:
    post:
      summary: Schedule a debit on a mandate
      description: 'Body: amount_minor, due_date (India time), optional invoice_id. Refused with 422 exceeds_mandate_limit,
        outside_mandate_dates or notice_too_short (the payer must be told at least the notice window ahead), and 409 period_already_debited
        or debit_exists. A mandate is never debited twice for one day. Requires an Idempotency-Key.'
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: The scheduled debit
        '409':
          description: Not active, or a debit already exists in that period
        '422':
          description: Over the limit, outside the dates, or too soon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDebit'
    get:
      summary: List a mandate's debits
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '404':
          description: Not found
  /v1/subscriptions/{id}/mandate:
    post:
      summary: Link a mandate to a subscription so its invoices are collected automatically
      description: 'Body: mandate_id, or null to unlink. When the mandate is active, each invoice the subscription raises
        is scheduled as a debit on its due date (or the earliest date the notice allows) and marked paid when the debit is
        captured. Otherwise the invoice stays open for the usual reminders.'
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  mandate_id: {}
        '422':
          description: The mandate belongs to a different customer
        '404':
          description: Not found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkMandate'
