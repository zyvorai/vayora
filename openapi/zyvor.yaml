        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/customers/{id}/statement:
    get:
      summary: Customer statement with running balance
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/subscriptions/{id}/change_plan:
    post:
      summary: Change plan mid-period; upgrades are prorated
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/milestones:
