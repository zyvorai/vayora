                  mandate: {}
                  debits: {}
        '404':
          description: Not found
  /v1/mandates/{id}/refresh:
    post:
      summary: Ask the provider where the mandate stands
      description: Moves our record to what the provider reports (approved, declined, revoked by the payer). Never undoes
        a merchant pause.
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateRow'
        '409':
          description: The mandate is not in a state that allows this
        '404':
          description: Not found
  /v1/mandates/{id}/pause:
    post:
      summary: Pause a mandate (a merchant hold)
      description: No debit goes out while paused. The provider and the payer's mandate are unchanged.
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateRow'
        '409':
          description: The mandate is not in a state that allows this
        '404':
          description: Not found
  /v1/mandates/{id}/resume:
    post:
      summary: Resume a paused mandate
      tags:
