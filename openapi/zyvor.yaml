openapi: 3.1.0
info:
  title: Zyvor Payments API
  version: 0.1.0
  description: Multi-tenant payment orchestration, ledger and reconciliation. Amounts are integer minor units (paise). Provider
    integrations are SANDBOX/SIMULATED until verified against live provider sandboxes. Every state-changing payment endpoint
    requires an Idempotency-Key.
servers:
- url: http://localhost:8080
  description: local
security:
- bearer: []
paths:
  /v1/payment_intents/{id}:
    get:
      summary: Get a payment intent with its attempts
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  intent:
                    $ref: '#/components/schemas/IntentRow'
                  attempts:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}:
    get:
      summary: Get an attempt
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}/refresh:
    post:
      summary: Ask the provider where an attempt stands now
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}/cancel:
    post:
      summary: Cancel an attempt that has not been paid
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}/capture:
    post:
      summary: Capture an authorised attempt (manual capture)
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/provider_accounts/{provider}/enabled:
    post:
      summary: Turn a provider on or off for routing (send enabled true or false)
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  enabled:
                    type: boolean
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Toggle'
  /v1/payment_attempts/{id}/simulate_event:
    post:
      summary: Deliver the provider's late update for a pending simulated payment (test mode only)
      tags:
      - payments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptRow'
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateEvent'
  /v1/refunds:
    get:
      summary: List refunds (filter status=failed for the failed-refund queue)
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RefundRow'
                  has_more:
                    type: boolean
        4XX:
          $ref: '#/components/responses/Error'
  /v1/refunds/{id}:
    get:
      summary: Get a refund
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/approve:
    post:
      summary: Approve a refund above the threshold (different person than requester)
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/reject:
    post:
      summary: Reject a refund awaiting approval
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/retry:
    post:
      summary: Retry a failed refund
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/refresh:
    post:
      summary: Resolve a refund with an unknown outcome
      tags:
      - refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRow'
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/settlements:
    get:
      summary: List settlements
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {}
        4XX:
          $ref: '#/components/responses/Error'
  /v1/settlements/import:
    post:
      summary: Import a provider settlement
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlement: {}
                  payments:
                    type: array
                    items: {}
                  refunds:
                    type: array
                    items: {}
                  adjustments:
                    type: array
                    items: {}
                  fees: {}
                  fee_check: {}
                  arithmetic: {}
                  expected_minor:
                    type: integer
                  received_minor:
                    type: integer
                  difference_minor:
                    type: integer
                  difference_breakdown: {}
                  bank_match: {}
                  bank_difference: {}
                  suggested_bank_matches: {}
                  cases:
                    type: array
                    items: {}
                  narrative:
                    type: boolean
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSettlement'
  /v1/settlements/sync:
    post:
      summary: Pull settlements from the provider
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
  /v1/settlements/{id}/simulate_bank:
    post:
      summary: Add the bank credit a simulated settlement would produce (test mode only)
      tags:
      - reconciliation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
                  duplicates: {}
                  rows: {}
                  settlements_rechecked:
                    type: integer
                  matched: {}
                  cases_opened: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateBank'
  /v1/settlements/{id}/explain:
    get:
      summary: Explain every rupee of a settlement
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlement: {}
                  payments:
                    type: array
                    items: {}
                  refunds:
                    type: array
                    items: {}
                  adjustments:
                    type: array
                    items: {}
                  fees: {}
                  fee_check: {}
                  arithmetic: {}
                  expected_minor:
                    type: integer
                  received_minor:
                    type: integer
                  difference_minor:
                    type: integer
                  difference_breakdown: {}
                  bank_match: {}
                  bank_difference: {}
                  suggested_bank_matches: {}
                  cases:
                    type: array
                    items: {}
                  narrative:
                    type: boolean
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/bank_statements/import:
    post:
      summary: Import bank statement lines and match them
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
                  duplicates: {}
                  rows: {}
                  settlements_rechecked:
                    type: integer
                  matched: {}
                  cases_opened: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBank'
  /v1/recon/cases:
    get:
      summary: List reconciliation cases
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {}
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
        x-generated: true
      - name: kind
        in: query
        required: false
        schema:
          type: string
        x-generated: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
        x-generated: true
  /v1/recon/cases/{id}/assign:
    post:
      summary: Assign a case
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  assignee:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assign'
  /v1/recon/cases/{id}/resolve:
    post:
      summary: Resolve a case
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconResolve'
  /v1/recon/scan:
    post:
      summary: Find captured payments missing from settlements
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_cases:
                    type: integer
                  settlements_without_bank_credit: {}
                  payouts_without_bank_debit: {}
        4XX:
          $ref: '#/components/responses/Error'
  /v1/sim/fail_next_refund:
    post:
      summary: Force the next simulator refund to fail (test mode)
      tags:
      - sandbox
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        4XX:
          $ref: '#/components/responses/Error'
  /v1/analytics/cost:
    get:
      summary: Effective processing cost and routing suggestions
      tags:
      - analytics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  by_provider_method:
                    type: array
                    items: {}
                  suggestions: {}
        4XX:
          $ref: '#/components/responses/Error'
  /v1/fee_rules:
    get:
      summary: List fee rules (rates you entered from your own contract)
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
                  note:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Add a fee rule for a provider and method, from an effective date
      tags:
      - reconciliation
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  provider:
                    type: string
                  method: {}
                  bps: {}
                  flat_minor:
                    type: integer
                  cap_minor:
                    type: integer
                  gst_bps: {}
                  refund_returns_fee: {}
                  effective_from: {}
                  note:
                    type:
                    - string
                    - 'null'
                  created_by: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRule'
  /v1/fee_rules/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Remove a fee rule (recorded findings keep the rule they were checked against)
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
        4XX:
          $ref: '#/components/responses/Error'
  /v1/fee_checks/settings:
    get:
      summary: Fee check tolerance and owner
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tolerance_minor:
                    type: integer
                  owner: {}
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Set the fee check tolerance (paise) and who owns new findings
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tolerance_minor:
                    type: integer
                  owner:
                    type: boolean
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeCheckSettingsBody'
  /v1/fee_checks/summary:
    get:
      summary: Open fee findings, total variance, by provider and method
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules_configured:
                    type: integer
                    format: int64
                  open_findings: {}
                  open_cases:
                    type: integer
                    format: int64
                  over_deducted_minor:
                    type: integer
                  under_deducted_minor:
                    type: integer
                  total_variance_minor:
                    type: integer
                  total_absolute_variance_minor:
                    type: integer
                  by_provider_method:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                        method:
                          type: string
                        open_findings:
                          type: integer
                          format: int64
                        settlements:
                          type: integer
                          format: int64
                        over_deducted_minor:
                          type: integer
                          format: int64
                        under_deducted_minor:
                          type: integer
                          format: int64
                        total_variance_minor:
                          type: integer
                  lines_without_a_rule:
                    type: integer
                    format: int64
                  message:
                    type:
                    - string
                    - 'null'
                  note:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
  /v1/fee_checks/findings:
    get:
      summary: List fee findings (payments whose deducted fee differs from your rule)
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {}
                  note:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
        x-generated: true
      - name: provider
        in: query
        required: false
        schema:
          type: string
        x-generated: true
      - name: method
        in: query
        required: false
        schema:
          type: string
        x-generated: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
        x-generated: true
  /v1/fee_checks/run:
    post:
      summary: Re-check settlements against the current fee rules
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlements_checked:
                    type: integer
                  flagged: {}
                  ok:
                    type: boolean
                  no_rule: {}
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeCheckRunBody'
  /v1/settlements/{id}/fee_check:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: What the fee check says about one settlement (writes nothing)
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt_id:
                    type:
                    - string
                    - 'null'
                  provider:
                    type: string
                  method: {}
                  status:
                    type: string
                  payment_minor:
                    type: integer
                  refunded_minor:
                    type: integer
                  actual_minor:
                    type: integer
                  expected_minor:
                    type: integer
                  variance_minor:
                    type: integer
                  rule: {}
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Re-check one settlement and record the finding
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt_id:
                    type:
                    - string
                    - 'null'
                  provider:
                    type: string
                  method: {}
                  status:
                    type: string
                  payment_minor:
                    type: integer
                  refunded_minor:
                    type: integer
                  actual_minor:
                    type: integer
                  expected_minor:
                    type: integer
                  variance_minor:
                    type: integer
                  rule: {}
        4XX:
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      summary: Who this key is (tenant, env, scopes, actor)
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  env:
                    type: string
                  key_id:
                    type: string
                  actor:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                  branch_id:
                    type:
                    - string
                    - 'null'
        4XX:
          $ref: '#/components/responses/Error'
  /v1/api_requests:
    get:
      summary: Recent authenticated API calls (no bodies)
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        actor:
                          type: string
                        method:
                          type: string
                        route:
                          type: string
                        status:
                          type: integer
                          format: int32
                        request_id:
                          type: string
                        latency_ms:
                          type: integer
                          format: int32
                        created_at:
                          type: object
        4XX:
          $ref: '#/components/responses/Error'
  /v1/api_keys:
    get:
      summary: Create or list scoped API keys
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        branch_id:
                          type:
                          - string
                          - 'null'
                        id:
                          type: string
                        name:
                          type: string
                        prefix:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                        created_at:
                          type: object
                        revoked_at:
                          type: object
                        expires_at:
                          type: object
                        last_used_at:
                          type: object
                        allowed_cidrs:
                          type: array
                          items:
                            type: string
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list scoped API keys
      tags:
      - admin
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  key:
                    type: string
                  prefix:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                  expires_at:
                    type:
                    - object
                    - 'null'
                  allowed_cidrs:
                    type: array
                    items:
                      type: string
                  note:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewKey'
  /v1/api_keys/{id}/rotate:
    post:
      summary: Mint a replacement key; the old one expires after an overlap window
      tags:
      - keys
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
