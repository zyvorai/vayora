openapi: 3.1.0
info:
  title: Zyvor Payments API
  version: 0.1.0
  description: Multi-tenant payment orchestration, ledger and reconciliation. Amounts are integer minor units (paise). Provider
    integrations are SANDBOX/SIMULATED until verified against live provider sandboxes. Every state-changing payment endpoint
    requires an Idempotency-Key.
servers:
- url: http://localhost:8080
  description: local
security:
- bearer: []
paths:
  /v1/payment_intents/{id}:
    get:
      summary: Get a payment intent with its attempts
      tags:
      - payments
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/payment_attempts/{id}:
    get:
      summary: Get an attempt
      tags:
      - payments
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds:
    get:
      summary: List refunds (filter status=failed for the failed-refund queue)
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/refunds/{id}:
    get:
      summary: Get a refund
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/approve:
    post:
      summary: Approve a refund above the threshold (different person than requester)
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/reject:
    post:
      summary: Reject a refund awaiting approval
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/retry:
    post:
      summary: Retry a failed refund
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/refunds/{id}/refresh:
    post:
      summary: Resolve a refund with an unknown outcome
      tags:
      - refunds
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/settlements:
    get:
      summary: List settlements
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/settlements/import:
    post:
      summary: Import a provider settlement
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/settlements/sync:
    post:
      summary: Pull settlements from the provider
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/settlements/{id}/explain:
    get:
      summary: Explain every rupee of a settlement
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/bank_statements/import:
    post:
      summary: Import bank statement lines and match them
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/recon/cases:
    get:
      summary: List reconciliation cases
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/recon/cases/{id}/assign:
    post:
      summary: Assign a case
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/recon/cases/{id}/resolve:
    post:
      summary: Resolve a case
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/recon/scan:
    post:
      summary: Find captured payments missing from settlements
      tags:
      - reconciliation
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/analytics/cost:
    get:
      summary: Effective processing cost and routing suggestions
      tags:
      - analytics
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/api_keys:
    get:
      summary: Create or list scoped API keys
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list scoped API keys
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/api_keys/{id}/rotate:
    post:
      summary: Mint a replacement key; the old one expires after an overlap window
      tags:
      - keys
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/api_keys/{id}/revoke:
    post:
      summary: Revoke an API key
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/customers:
    get:
      summary: Find customers (external_ref filter)
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create a customer
      tags:
      - customers
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/customers/{id}:
    get:
      summary: Get a customer
      tags:
      - customers
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/branches:
    get:
      summary: Create or list branches
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list branches
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/users:
    post:
      summary: Create a user
      tags:
      - admin
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/invoices:
    get:
      summary: Create or list invoices
      tags:
      - invoices
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list invoices
      tags:
      - invoices
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/invoices/{id}:
    get:
      summary: Get an invoice with allocations
      tags:
      - invoices
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/collections/ageing:
    get:
      summary: Outstanding invoices by days past due (as_of optional)
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/collections/promises:
    get:
      summary: Promises to pay with derived status (open, kept, broken, canceled)
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/collections/dunning/run:
    post:
      summary: Remind every overdue invoice with no live promise (repeat-safe)
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/collections/drafts:
    get:
      summary: Reminder drafts waiting for a decision
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/collections/drafts/{id}/approve:
    post:
      summary: Approve a reminder draft (optionally edited): logs it and emits invoice.reminder
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
