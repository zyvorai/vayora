          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  revoked:
                    type: boolean
        4XX:
          $ref: '#/components/responses/Error'
  /v1/provider_accounts:
    get:
      summary: Connected payment providers (admin)
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Connect a payment provider (admin); credentials are encrypted and never returned
      tags:
      - payments
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  provider:
                    type: string
                  updated: {}
                  webhook_url:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProviderAccount'
  /v1/provider_accounts/{provider}/check:
    post:
      summary: 'Ask the provider whether it accepts this account''s credentials (read-only; a refusal is `ok: false`)'
      tags:
      - providers
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  ok:
                    type: boolean
                  detail: {}
                  env:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
  /v1/mandates:
    post:
      summary: Create a UPI AutoPay mandate for the payer to approve
      description: 'Body: customer_id, max_amount_minor (per debit), frequency (daily, weekly, fortnightly, monthly, bimonthly,
        quarterly, half_yearly, yearly or as_presented), start_date, end_date, optional provider and external_ref. Needs a
        connected provider that supports mandates (today only the simulator); otherwise 422 no_route. Requires an Idempotency-Key.
        The response carries the authorization link the payer approves. The limit and notice rules are configurable (ZYVOR_MANDATE_MAX_MINOR,
        ZYVOR_MANDATE_NOTICE_HOURS) and must be checked against the current NPCI circular and your provider before live use.'
      tags:
      - mandates
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateRow'
        '422':
          description: Invalid limit, dates, currency or no provider supports mandates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMandate'
    get:
      summary: List mandates
      description: Filter by status or customer_id.
      tags:
      - mandates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MandateRow'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
        x-generated: true
      - name: customer_id
        in: query
        required: false
        schema:
          type: string
        x-generated: true
  /v1/mandates/run:
    post:
      summary: Run the mandate pass for this tenant now
      description: Expires ended mandates, emits due pre-debit notices, sends the debits that are due and settles those in
        flight. The worker does this on its own; this is a sandbox and test aid. The in-process simulator only works when
        the API itself runs the pass.
      tags:
      - mandates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /v1/mandates/{id}:
    get:
      summary: Get a mandate with its recent debits
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mandate: {}
                  debits:
                    type: array
                    items:
                      $ref: '#/components/schemas/DebitRow'
        '404':
          description: Not found
  /v1/mandates/{id}/refresh:
    post:
      summary: Ask the provider where the mandate stands
      description: Moves our record to what the provider reports (approved, declined, revoked by the payer). Never undoes
        a merchant pause.
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateRow'
        '409':
          description: The mandate is not in a state that allows this
        '404':
          description: Not found
  /v1/mandates/{id}/pause:
    post:
      summary: Pause a mandate (a merchant hold)
      description: No debit goes out while paused. The provider and the payer's mandate are unchanged.
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateRow'
        '409':
          description: The mandate is not in a state that allows this
        '404':
          description: Not found
  /v1/mandates/{id}/resume:
    post:
      summary: Resume a paused mandate
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateRow'
        '409':
          description: The mandate is not in a state that allows this
        '404':
          description: Not found
  /v1/mandates/{id}/revoke:
    post:
      summary: Revoke a mandate
      description: Stops debiting first, cancels debits not yet sent, then asks the provider; a provider failure is recorded
        on the mandate, not hidden.
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateRow'
        '409':
          description: The mandate is not in a state that allows this
        '404':
          description: Not found
  /v1/mandates/{id}/debits:
    post:
      summary: Schedule a debit on a mandate
      description: 'Body: amount_minor, due_date (India time), optional invoice_id. Refused with 422 exceeds_mandate_limit,
        outside_mandate_dates or notice_too_short (the payer must be told at least the notice window ahead), and 409 period_already_debited
        or debit_exists. A mandate is never debited twice for one day. Requires an Idempotency-Key.'
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitRow'
        '409':
          description: Not active, or a debit already exists in that period
        '422':
          description: Over the limit, outside the dates, or too soon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDebit'
    get:
      summary: List a mandate's debits
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DebitRow'
        '404':
          description: Not found
  /v1/subscriptions/{id}/mandate:
    post:
      summary: Link a mandate to a subscription so its invoices are collected automatically
      description: 'Body: mandate_id, or null to unlink. When the mandate is active, each invoice the subscription raises
        is scheduled as a debit on its due date (or the earliest date the notice allows) and marked paid when the debit is
        captured. Otherwise the invoice stays open for the usual reminders.'
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  mandate_id:
                    type:
                    - string
                    - 'null'
        '422':
          description: The mandate belongs to a different customer
        '404':
          description: Not found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkMandate'
  /v1/sim/mandate:
    post:
      summary: Approve or decline the simulator's UPI mandate (test mode only)
      description: 'Body: upi_uri (the upi://mandate link from the mandate authorization) and approve. Answers 404 unless
        the server was started with ZYVOR_SIM_PAYER=1. Only touches the in-process simulator.'
      tags:
      - mandates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '404':
          description: Not enabled on this server
        '409':
          description: Nothing pending for this link
        '422':
          description: Not a simulator mandate link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decide'
  /v1/sim/mandate/{id}:
    get:
      summary: What the payer's bank shows about a simulated mandate (test mode only)
      description: 'Returns the mandate status, its per-debit limit and the debits the simulated bank took. Upcoming debits
        are not shown: Zyvor emits the pre-debit notice to the merchant and does not deliver it to the payer. Answers 404
        unless ZYVOR_SIM_PAYER=1. Only touches the in-process simulator.'
      tags:
      - mandates
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not enabled on this server, or unknown mandate
  /v1/sim/mandate/revoke:
    post:
      summary: Revoke a simulated mandate as the payer would from their UPI app (test mode only)
      description: 'Body: mandate_id. Answers 404 unless ZYVOR_SIM_PAYER=1. Zyvor learns of it when the mandate is refreshed.'
      tags:
      - mandates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '404':
          description: Not enabled on this server
        '409':
          description: No live mandate with that id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimMandateRevoke'
  /v1/sim/circle:
    post:
      summary: Open a simulated circle, where a delegate may pay from a primary payer's account up to a limit (test mode only)
      description: 'Body: primary, delegate, max_per_payment_minor, total_limit_minor. Answers 404 unless ZYVOR_SIM_PAYER=1.
        Only the in-process simulator; no money moves. The real rules of UPI Circle are not verified here.'
      tags:
      - sandbox
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  circle_id:
                    type:
                    - string
                    - 'null'
        '404':
          description: Not enabled on this server
        '422':
          description: Invalid names or limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimCircleCreate'
  /v1/sim/circle/{id}:
    get:
      summary: What the primary payer's bank shows about a simulated circle (test mode only)
      description: Returns the limits, what was spent and the payments behind it. Answers 404 unless ZYVOR_SIM_PAYER=1.
      tags:
      - sandbox
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not enabled on this server, or unknown circle
  /v1/sim/circle/revoke:
    post:
      summary: The primary takes a simulated circle back (test mode only)
      description: 'Body: circle_id. Answers 404 unless ZYVOR_SIM_PAYER=1. Spends already made stay recorded.'
      tags:
      - sandbox
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '404':
          description: Not enabled on this server
        '409':
          description: No live circle with that id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimCircleRevoke'
  /v1/sim/circle/pay:
    post:
      summary: A delegate pays a sandbox UPI payload through a simulated circle (test mode only)
      description: 'Body: circle_id and upi_uri. The amount is read from the payment, never from the request, and the per-payment
        and total limits are checked before anything is approved. Answers 404 unless ZYVOR_SIM_PAYER=1.'
      tags:
      - sandbox
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  remaining_minor:
                    type: integer
        '404':
          description: Not enabled on this server, or unknown circle
        '409':
          description: Circle revoked, already paid, or nothing pending for this QR
        '422':
          description: Not a simulator payload, or over the circle's limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimCirclePay'
  /v1/sim/pay:
    post:
      summary: Pay or decline the simulator's UPI payload (test mode only)
      description: 'Body: {"upi_uri": "upi://pay?pa=sandbox@zyvor-sim&tn=<attempt_id>...", "approve": true}. Lets a test payer
        app complete a payment against the in-process simulator without a bank. Answers 404 unless the server was started
        with ZYVOR_SIM_PAYER=1. 422 not_a_sim_payment when the payee is not the simulator or the input is not a UPI link;
        409 nothing_to_pay when the attempt is not waiting for a payer. Never touches a real provider.'
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '404':
          description: Not enabled on this server
        '409':
          description: The attempt is not waiting for a payer
        '422':
          description: Not a simulator UPI payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimPayPay'
  /v1/console/logout:
