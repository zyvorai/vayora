components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "zk_test_\u2026 / zk_live_\u2026 scoped API key"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
      description: Repeating a request with the same key returns the original result and never repeats the operation.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
    PaymentIntent:
      type: object
      properties:
        id:
          type: string
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          enum:
          - INR
          - USD
        status:
          type: string
          enum:
          - requires_payment_method
          - processing
          - succeeded
          - failed
          - canceled
        capture_method:
          type: string
          enum:
          - automatic
          - manual
        customer_id:
          type:
          - string
          - 'null'
        invoice_id:
          type:
          - string
          - 'null'
        external_ref:
          type:
          - string
          - 'null'
          description: The business object being paid for (student fee, patient deposit, sales order)
        client_secret:
          type: string
          description: Returned once at creation; authorises the public checkout for this intent
    PaymentAttempt:
      type: object
      properties:
        id:
          type: string
        intent_id:
          type: string
        provider:
          type: string
          enum:
          - razorpay
          - cashfree
          - sim
        method:
          type: string
          enum:
          - upi
          - card
          - netbanking
          - wallet
        status:
          type: string
          enum:
          - created
          - pending
          - authorized
          - captured
          - failed
          - unknown
          description: '`unknown` means the provider''s outcome is not known yet; no other attempt can start until it resolves.'
        route:
          type: object
          description: 'Why this provider was chosen: every provider considered and the reason'
        client_action:
          type:
          - object
          - 'null'
        refunded_minor:
          type: integer
        reserved_refund_minor:
          type: integer
    Refund:
      type: object
      properties:
        id:
          type: string
        amount_minor:
          type: integer
        status:
          type: string
          enum:
          - pending_approval
          - processing
          - processed
          - failed
          - rejected
          - unknown
        requested_by:
          type: string
        approved_by:
          type:
          - string
          - 'null'
        external_ref:
          type:
          - string
          - 'null'
