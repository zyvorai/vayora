        in: path
        required: true
        schema:
          type: string
  /v1/collections/drafts/{id}/reject:
    post:
      summary: Reject a reminder draft
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/invoices/{id}/reminders/draft:
    post:
      summary: Draft a reminder for review, optionally worded by the AI assistant
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/collections/promises/{id}/cancel:
    post:
      summary: Cancel a promise to pay
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/invoices/{id}/promises:
    post:
      summary: Record a promise to pay against an invoice
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/invoices/{id}/reminders:
    get:
      summary: Reminder history for an invoice
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Log a reminder and emit invoice.reminder
      tags:
      - collections
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/plans:
    get:
      summary: Create or list billing plans
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list billing plans
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/subscriptions:
    get:
      summary: Create or list subscriptions
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
    post:
      summary: Create or list subscriptions
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/subscriptions/{id}/pause:
    post:
      summary: Pause a subscription
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/subscriptions/{id}/resume:
    post:
      summary: Resume a paused subscription
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/subscriptions/{id}/cancel:
    post:
      summary: Cancel a subscription
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/subscriptions/{id}/usage:
    post:
      summary: Record metered usage (idempotent by reference)
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/billing/run:
    post:
      summary: Invoice every subscription that is due (idempotent per period)
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
          $ref: '#/components/responses/Error'
  /v1/invoices/{id}/credit_notes:
    post:
      summary: Issue a credit note against an invoice
      tags:
      - billing
      responses:
        '200':
          description: OK
        4XX:
