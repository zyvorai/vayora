{{- if .Values.edge.envoy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata: { name: {{ .Release.Name }}-envoy }
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: https
          address: { socket_address: { address: 0.0.0.0, port_value: 8443 } }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_params: { tls_minimum_protocol_version: TLSv1_2 }
                    tls_certificates:
                      - certificate_chain: { filename: /certs/tls.crt }
                        private_key: { filename: /certs/tls.key }
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: edge
                    use_remote_address: true
                    route_config:
                      name: local
                      virtual_hosts:
                        - name: all
                          domains: ["*"]
                          routes:
                            - { match: { prefix: / }, route: { cluster: api, timeout: 30s } }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
      clusters:
        - name: api
          type: STRICT_DNS
          load_assignment:
            cluster_name: api
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: {{ .Release.Name }}-api, port_value: 8080 } } } }] }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-edge
  labels: {{- include "zyvor.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, component: edge } }
  template:
    metadata: { labels: { app.kubernetes.io/instance: {{ .Release.Name }}, component: edge } }
    spec:
      containers:
        - name: envoy
          image: {{ .Values.edge.envoy.image }}
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports: [{ containerPort: 8443 }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/envoy, readOnly: true }
            - { name: tls, mountPath: /certs, readOnly: true }
      volumes:
        - { name: cfg, configMap: { name: {{ .Release.Name }}-envoy } }
        - { name: tls, secret: { secretName: {{ .Values.edge.envoy.tlsSecretName }} } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-edge }
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, component: edge }
  ports: [{ name: https, port: 443, targetPort: 8443 }]
{{- end }}
