{{- if .Values.edge.setura.enabled }}
# Edge: Setura (github.com/zyvorai/zyvor-setura-gateway) in file mode, same shape as the Envoy edge it replaces.
# TODO(setura): Envoy pinned TLS >= 1.2 explicitly; Setura has no per-listener TLS version knob.
apiVersion: v1
kind: ConfigMap
metadata: { name: {{ .Release.Name }}-setura }
data:
  gateway.json: |
    {
      "schema": "setura.route-specs/v1",
      "namespace": "zyvor",
      "resources": {
        "gateways.gateway.networking.k8s.io/edge": {
          "gatewayClassName": "setura",
          "listeners": [
            {
              "name": "https",
              "protocol": "HTTPS",
              "port": 8443,
              "tls": {
                "mode": "Terminate",
                "certificateRefs": [
                  {
                    "name": "edge-cert"
                  }
                ]
              }
            }
          ]
        },
        "httproutes.gateway.networking.k8s.io/edge": {
          "parentRefs": [
            {
              "name": "edge",
              "sectionName": "https"
            }
          ],
          "rules": [
            {
              "matches": [
                {
                  "path": {
                    "type": "PathPrefix",
                    "value": "/"
                  }
                }
              ],
              "timeouts": {
                "request": "30s"
              },
              "backendRefs": [
                {
                  "name": "api",
                  "port": 8080
                }
              ]
            }
          ]
        }
      },
      "backends": {
        "api:8080": {
          "endpoints": [
            "{{ .Release.Name }}-api:8080"
          ]
        }
      },
      "secrets": {
        "edge-cert": {
          "certFile": "/certs/tls.crt",
          "keyFile": "/certs/tls.key"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-edge
  labels: {{- include "zyvor.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, component: edge } }
  template:
    metadata: { labels: { app.kubernetes.io/instance: {{ .Release.Name }}, component: edge } }
    spec:
      containers:
        - name: setura
          image: {{ .Values.edge.setura.image }}
          args: ["gateway", "run", "--config=/etc/setura/gateway.json", "--bind=0.0.0.0"]
          ports: [{ containerPort: 8443 }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/setura, readOnly: true }
            - { name: tls, mountPath: /certs, readOnly: true }
      volumes:
        - { name: cfg, configMap: { name: {{ .Release.Name }}-setura } }
        - { name: tls, secret: { secretName: {{ .Values.edge.setura.tlsSecretName }} } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-edge }
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, component: edge }
  ports: [{ name: https, port: 443, targetPort: 8443 }]
{{- end }}
