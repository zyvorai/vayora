{{- if .Values.networkPolicy.enabled }}
# Workers accept no inbound traffic; only the edge and Prometheus may reach the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-worker-deny-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, component: worker } }
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-api-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, component: api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, component: edge } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8080 }]
{{- end }}
