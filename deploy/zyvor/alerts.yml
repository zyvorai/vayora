# Alert rules for the gauges the API exposes at /metrics. Load with `rule_files` in prometheus.yml.
# Thresholds are starting points: a dead item is something Zyvor gave up on, so any is worth a look.
groups:
  - name: zyvor
    rules:
      - alert: ZyvorMailDead
        expr: zyvor_mail_dead > 0
        for: 5m
        annotations: { summary: "Email could not be delivered after retries (mail_queue.status = 'dead'). Check the SMTP settings and last_error." }
      - alert: ZyvorMailBacklog
        expr: zyvor_mail_pending > 50
        for: 15m
        annotations: { summary: "More than 50 emails have been waiting for 15 minutes: is the worker running with SMTP settings?" }
      - alert: ZyvorOutboxDead
        expr: zyvor_outbox_dead > 0
        for: 5m
        annotations: { summary: "A webhook event to a merchant was given up on after its retries." }
      - alert: ZyvorLiveAccessOverdue
        expr: zyvor_live_access_overdue > 0
        for: 5m
        annotations: { summary: "A business has waited past the review target (ZYVOR_REVIEW_SLA_HOURS, default 24) for live access." }
      - alert: ZyvorLiveChangeOverdue
        expr: zyvor_live_changes_overdue > 0
        for: 5m
        annotations: { summary: "A live business's new bank account has waited past ZYVOR_CHANGE_SLA_HOURS (default 4) and its live payouts are held." }
      - alert: ZyvorReviewQueueUnattended
        expr: zyvor_review_on_duty == 0 and on() (zyvor_live_access_pending + zyvor_live_changes_pending) > 0
        for: 15m
        annotations: { summary: "Reviews or changes are waiting and nobody on the rota is on duty. (-1 means no hours are set, which does not alert.)" }
      - alert: ZyvorMetricsUnavailable
        expr: zyvor_outbox_pending < 0 or zyvor_mail_dead < 0
        for: 5m
        annotations: { summary: "The API could not count its queues (the gauge reports -1)." }
