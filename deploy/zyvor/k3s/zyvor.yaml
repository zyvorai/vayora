# Zyvor on a single-node k3s cluster, SANDBOX configuration: simulated Razorpay/Cashfree, in-cluster Postgres.
# Everything lives in the `zyvor` namespace. Services are cluster-internal: put TLS in front (deploy/zyvor/k3s/README.md). Secrets are created by deploy.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: zyvor
  labels:
    # the node is shared with other teams: refuse privileged pods here, and say what would break "restricted"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata: { name: zyvor-pg-init, namespace: zyvor }
data:
  10-app-role.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<SQL
    CREATE ROLE zyvor_app LOGIN PASSWORD '${ZYVOR_APP_PASSWORD}';
    CREATE DATABASE zyvor OWNER postgres;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: zyvor }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: zyvor-secrets, key: pg-owner-password } } }
            - { name: ZYVOR_APP_PASSWORD, valueFrom: { secretKeyRef: { name: zyvor-secrets, key: pg-app-password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe: { exec: { command: [pg_isready, -U, postgres] }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: init, configMap: { name: zyvor-pg-init, defaultMode: 0755 } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: zyvor }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
# Migrates as the schema owner, then grants the restricted app role (row-level security binds it).
apiVersion: batch/v1
kind: Job
metadata: { name: zyvor-migrate, namespace: zyvor }
spec:
  backoffLimit: 6
  template:
    metadata: { labels: { app: zyvor-migrate } }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: migrate
          image: localhost/zyvor-api:dev
          imagePullPolicy: Never
          command: ["zyvor-api", "migrate"]
          env:
            - { name: ZYVOR_MIGRATE_DATABASE_URL, valueFrom: { secretKeyRef: { name: zyvor-secrets, key: migrate-database-url } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: zyvor-secrets, key: database-url } } }
      containers:
        - name: grants
          image: postgres:17
          command: ["sh", "-c", "psql \"$MIGRATE_URL\" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA public TO zyvor_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO zyvor_app; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO zyvor_app;'"]
          env:
            - { name: MIGRATE_URL, valueFrom: { secretKeyRef: { name: zyvor-secrets, key: migrate-database-url } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: zyvor-api, namespace: zyvor }
spec:
  replicas: 1
  selector: { matchLabels: { app: zyvor-api } }
  template:
    metadata: { labels: { app: zyvor-api } }
    spec:
      containers:
        - name: api
          image: localhost/zyvor-api:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ZYVOR_BIND, value: "0.0.0.0:8080" }
            - { name: ZYVOR_PROVIDER_TIMEOUT_SECS, value: "5" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: zyvor-secrets, key: database-url } } }
            - { name: ZYVOR_MASTER_KEY, valueFrom: { secretKeyRef: { name: zyvor-secrets, key: master-key } } }
            # SANDBOX: the simulated providers and webhook sinks live on private cluster addresses
            - { name: ZYVOR_ALLOW_PRIVATE_TARGETS, value: "1" }
            # Caddy on the host, then the checkout app's rewrite: two proxies vouch for X-Forwarded-For
            - { name: ZYVOR_TRUST_PROXY_HOPS, value: "2" }
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: zyvor-api, namespace: zyvor }
spec: { selector: { app: zyvor-api }, ports: [{ port: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: zyvor-worker, namespace: zyvor }
spec:
  replicas: 1
  selector: { matchLabels: { app: zyvor-worker } }
  template:
    metadata: { labels: { app: zyvor-worker } }
    spec:
      containers:
        - name: worker
          image: localhost/zyvor-api:dev
          imagePullPolicy: Never
          command: ["zyvor-worker"]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: zyvor-secrets, key: database-url } } }
            - { name: ZYVOR_MASTER_KEY, valueFrom: { secretKeyRef: { name: zyvor-secrets, key: master-key } } }
            # SANDBOX: the simulated providers and webhook sinks live on private cluster addresses
            - { name: ZYVOR_ALLOW_PRIVATE_TARGETS, value: "1" }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
# SANDBOX ONLY: simulated Razorpay and Cashfree. Never deploy this next to live credentials.
apiVersion: apps/v1
kind: Deployment
metadata: { name: provider-mock, namespace: zyvor }
spec:
  replicas: 1
  selector: { matchLabels: { app: provider-mock } }
  template:
    metadata: { labels: { app: provider-mock } }
    spec:
      containers:
        - name: mock
          image: localhost/zyvor-api:dev
          imagePullPolicy: Never
          command: ["zyvor-provider-mock"]
          env:
            - { name: PORT, value: "9090" }
            - { name: MOCK_RAZORPAY_WEBHOOK_SECRET, value: rz_hook }
            - { name: MOCK_CASHFREE_WEBHOOK_SECRET, value: cf_hook }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: provider-mock, namespace: zyvor }
spec: { selector: { app: provider-mock }, ports: [{ port: 9090 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: zyvor-checkout, namespace: zyvor }
spec:
  replicas: 1
  selector: { matchLabels: { app: zyvor-checkout } }
  template:
    metadata: { labels: { app: zyvor-checkout } }
    spec:
      containers:
        - name: checkout
          image: localhost/zyvor-checkout:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: zyvor-checkout, namespace: zyvor }
spec: { selector: { app: zyvor-checkout }, ports: [{ port: 3000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: zyvor-console, namespace: zyvor }
spec:
  replicas: 1
  selector: { matchLabels: { app: zyvor-console } }
  template:
    metadata: { labels: { app: zyvor-console } }
    spec:
      containers:
        - name: console
          image: localhost/zyvor-console:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 3003 }]
          env:
            - { name: ZYVOR_API_URL, value: "http://zyvor-api:8080" }
            - { name: CONSOLE_USER, value: console }
            - { name: ZYVOR_API_KEY, valueFrom: { secretKeyRef: { name: zyvor-console, key: api-key } } }
            - { name: CONSOLE_USERNAME, valueFrom: { secretKeyRef: { name: zyvor-console, key: username } } }
            - { name: CHECKOUT_PUBLIC_URL, value: "https://pay.80-79-5-173.sslip.io" }
            - { name: CONSOLE_PASSWORD, valueFrom: { secretKeyRef: { name: zyvor-console, key: password } } }
            - { name: CONSOLE_SESSION_SECRET, valueFrom: { secretKeyRef: { name: zyvor-console, key: session-secret } } }
          readinessProbe: { httpGet: { path: /login, port: 3003 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: zyvor-console, namespace: zyvor }
spec: { selector: { app: zyvor-console }, ports: [{ port: 3003 }] }
---
# Network policy: nothing reaches a pod unless allowed below. The node is shared with other teams'
# namespaces, so Postgres and the API must not be reachable from them. Egress is left open for DNS
# and the payment providers; ingress is the part that protects the data.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: zyvor }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-from-zyvor-only, namespace: zyvor }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: zyvor-api } }
        - podSelector: { matchLabels: { app: zyvor-worker } }
        - podSelector: { matchLabels: { app: zyvor-migrate } }
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-from-console-and-checkout, namespace: zyvor }
spec:
  podSelector: { matchLabels: { app: zyvor-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: zyvor-console } }
        - podSelector: { matchLabels: { app: zyvor-checkout } }
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: provider-mock-from-api-and-worker, namespace: zyvor }
spec:
  podSelector: { matchLabels: { app: provider-mock } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: zyvor-api } }
        - podSelector: { matchLabels: { app: zyvor-worker } }
      ports: [{ port: 9090 }]
---
# The two public faces are reached by the host's Caddy (HTTPS) and nothing else is meant to; the pod
# network cannot tell Caddy from other callers, so these stay open on their own port only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: public-faces, namespace: zyvor }
spec:
  podSelector:
    matchExpressions: [{ key: app, operator: In, values: [zyvor-console, zyvor-checkout] }]
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 3003 }, { port: 3000 }]
