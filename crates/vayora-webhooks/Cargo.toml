[package]
name = "vayora-webhooks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "migrate", "macros"] }
serde_json.workspace = true
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"
tracing = "0.1.44"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { workspace = true, features = ["time", "macros", "rt-multi-thread"] }
chrono = { version = "0.4.45", features = ["serde"] }
vayora-core = { version = "0.1.0", path = "../vayora-core" }

[dev-dependencies]
axum.workspace = true
