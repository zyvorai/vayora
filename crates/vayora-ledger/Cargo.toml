[package]
name = "vayora-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uuid.workspace = true
vayora-core = { path = "../vayora-core" }
thiserror.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
