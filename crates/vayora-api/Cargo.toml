[package]
name = "vayora-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vayora-core = { path = "../vayora-core" }
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
vayora-ledger = { version = "0.1.0", path = "../vayora-ledger" }
vayora-upi = { version = "0.1.0", path = "../vayora-upi" }
vayora-webhooks = { version = "0.1.0", path = "../vayora-webhooks" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "migrate", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.1"
hex = "0.4.3"
subtle = "2.6.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "migrate", "macros"] }
vayora-webhooks = { path = "../vayora-webhooks" }
