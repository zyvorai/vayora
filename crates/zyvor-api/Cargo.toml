[package]
name = "zyvor-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uuid.workspace = true
aes-gcm = "0.11"
async-trait = "0.1.92"
axum.workspace = true
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "migrate", "macros"] }
subtle = "2.6.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zyvor-core = { version = "0.1.0", path = "../zyvor-core" }
zyvor-ledger = { version = "0.1.0", path = "../zyvor-ledger" }
zyvor-providers = { version = "0.1.0", path = "../zyvor-providers" }
opentelemetry = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["rt-tokio", "trace"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
argon2 = "0.6.0"
sha1 = "0.11.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

[dev-dependencies]
http-body-util = "0.1.5"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "migrate", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
zyvor-provider-mock = { path = "../zyvor-provider-mock" }
