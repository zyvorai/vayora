version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups: { rust-minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { js-minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # init and analyze must always be the same release; bump all codeql-action steps in one pull request.
    groups: { codeql-action: { patterns: ["github/codeql-action/*"] } }
  - package-ecosystem: pip
    directory: /sdks/python
    schedule: { interval: monthly }
  - package-ecosystem: gomod
    directory: /sdks/go
    schedule: { interval: monthly }
