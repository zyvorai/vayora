name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: vayora, POSTGRES_PASSWORD: vayora, POSTGRES_DB: vayora }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vayora" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://vayora:vayora@localhost:5432/vayora
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
