name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: vayora, POSTGRES_PASSWORD: vayora, POSTGRES_DB: vayora }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vayora" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://vayora:vayora@localhost:5432/vayora
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version: "1.22" }
      - run: cd sdks/go && go vet ./... && go test ./...
      - run: cd sdks/python && PYTHONPATH=. python3 -m unittest test_zyvor
      - name: The OpenAPI file parses, every operation has a summary and responses, and it matches the router
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open("openapi/zyvor.yaml"))
          bad = [f"{m.upper()} {p}" for p, ops in d["paths"].items() for m, o in ops.items()
                 if m in ("get", "post", "put", "patch", "delete") and not (o.get("summary") and o.get("responses"))]
          assert not bad, bad
          print(len(d["paths"]), "paths ok")
          PY
          python3 scripts/check-openapi.py
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tests and the screen gallery
        working-directory: apps/ios/Packages/VayoraKit
        run: |
          swift test
          swift build --product VayoraGallery
      - name: Both apps compile for the iOS simulator SDK (unsigned)
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
          for scheme in VayoraPay VayoraMerchant; do
            xcodebuild -project Vayora.xcodeproj -scheme "$scheme" -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          done
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/zyvor/helm/zyvor && helm template t deploy/zyvor/helm/zyvor --set sandbox.providerMock.enabled=true > /dev/null
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      # build first: the apps type-check against @zyvor/node's built types
      - run: pnpm -r build
      - run: pnpm -r lint
      - run: pnpm -r test
